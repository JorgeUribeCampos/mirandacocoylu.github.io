<style>
  :root {
    /* Colores exactos extraídos del diseño de Canva DAHQs4A7sFo */
    --blanco: #ffffff;
    --tinta: #1a1a1a;
    --rosa: #ed5fa6;
    --gris: #43403a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--blanco);
    color: var(--gris);
    font-family: "Archivo", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 44px 22px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* "&" gigante de fondo — eco de las texturas translúcidas del diseño */
  body::before {
    content: "&";
    position: fixed;
    right: -0.15em;
    bottom: -0.35em;
    font-family: "Archivo Black", sans-serif;
    font-size: 24rem;
    line-height: 1;
    color: var(--rosa);
    opacity: 0.06;
    pointer-events: none;
    z-index: 0;
  }

  .tarjeta {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
    animation: entrada 0.5s ease both;
  }

  @keyframes entrada {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tarjeta { animation: none; }
    .boton { transition: none !important; }
  }

  /* ── Cabecera: logo centrado, eslogan centrado debajo ── */

  .cabecera { text-align: center; }

  .logo-img {
    width: min(58vw, 220px);
    height: auto;
    display: block;
    margin: 0 auto;
  }

  .manifiesto {
    font-size: 0.82rem;
    line-height: 1.4;
    color: var(--gris);
    max-width: 34ch;
    margin: 18px auto 0;
  }

  /* ── Botones: blancos, borde negro fino, esquinas rectas ── */

  .botones { margin-top: 44px; display: flex; flex-direction: column; gap: 14px; }

  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 17px 20px;
    background: var(--blanco);
    border: 1.5px solid var(--tinta);
    color: var(--gris);
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-align: center;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .boton:hover, .boton:focus-visible {
    border-color: var(--rosa);
    color: var(--rosa);
    transform: translateY(-2px);
  }

  .boton:focus-visible { outline: 2px solid var(--rosa); outline-offset: 3px; }

  .boton svg { width: 21px; height: 21px; flex-shrink: 0; }

  .separador {
    margin: 34px 0 0;
    font-size: 0.7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: var(--rosa);
    text-align: center;
  }

  .separador + .botones { margin-top: 16px; }

  .pie {
    margin-top: 52px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--gris);
    opacity: 0.65;
  }
</style>
